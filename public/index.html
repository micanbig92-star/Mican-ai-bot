let replies=[],editId=null,photoFile=null,rec=null;

const $=x=>document.getElementById(x);

function toggleMicanMenu(force){
 const box=$('menuBox'),btn=$('menuToggle');
 const shouldOpen=typeof force==='boolean'?force:box.classList.contains('hidden');
 box.classList.toggle('hidden',!shouldOpen);
 btn.setAttribute('aria-expanded',String(shouldOpen));
 btn.setAttribute('aria-label',shouldOpen?'Close menu':'Open menu');
}

function page(p){
 ['chat','quiz','settings'].forEach(x=>
  $(x+'Page').classList.toggle('hidden',x!==p)
 );
 menuIfOpen();
 if(p==='quiz')showSubjects();
}

function menuIfOpen(){toggleMicanMenu(false)}

function add(t,who='bot',save=true){
 let d=document.createElement('div');
 d.className='msg '+(who==='user'?'user':'');
 d.textContent=(who==='user'?'You: ':'MICAN: ')+t;
 $('messages').append(d);
 $('messages').scrollTop=$('messages').scrollHeight;

 if(save){
  let h=JSON.parse(localStorage.getItem('micanHistory')||'[]');
  h.push({t,who});
  localStorage.setItem('micanHistory',JSON.stringify(h.slice(-100)));
 }
}

function newChat(){
 $('messages').replaceChildren();
 localStorage.removeItem('micanHistory');
 add("Hello! 👋 I'm MICAN AI. How can I help you today?",'bot',false);
 page('chat');

function history(){
 page('chat');
 $('messages').replaceChildren();
 JSON.parse(localStorage.getItem('micanHistory')||'[]')
 .forEach(x=>add(x.t,x.who,false));
}

function searchChats(){
 let s=prompt('Search chat history');
 if(!s)return;
 page('chat');
 $('messages').replaceChildren();
 JSON.parse(localStorage.getItem('micanHistory')||'[]')
 .filter(x=>x.t.toLowerCase().includes(s.toLowerCase()))
 .forEach(x=>add(x.t,x.who,false));
}

function suggest(s){$('question').value=s;ask()}

function norm(s){
 return(s||'').toLowerCase()
 .replace(/[^a-z0-9 ]/g,' ')
 .replace(/\s+/g,' ').trim();
}

async function loadReplies(){
 if(!db)return;
 let r=await db.from('mican_replies').select('*').eq('active',true);
 if(!r.error)replies=r.data||[];
}

async function findAnswer(q){
 await loadReplies();
 if(!db)return null;
 let n=norm(q),best=null,top=0;

 for(let r of replies){
  let s=norm(r.question);
  let w=[...new Set(s.split(' ').filter(x=>x.length>2))];
  let score=n===s?100:
   w.filter(x=>n.includes(x)).length/Math.max(1,w.length)*100;

  if(n.includes(s)||s.includes(n))score=Math.max(score,75);
  if(score>top){top=score;best=r}
 }

 return top>=45?best:null;
}

async function ask(){
 let q=$('question').value.trim();
 if(!q)return;

 $('question').value='';
 add(q,'user');

 if(db){
  await db.from('mican_activity').insert({
   activity_type:'question',question:q
  });
 }

 let r=await findAnswer(q);

 if(r){
  add(r.answer);
  let row=document.createElement('div');

  ['helpful','not_helpful'].forEach((v,i)=>{
   let b=document.createElement('button');
   b.className='alt';
   b.textContent=i?'👎 Not helpful':'👍 Helpful';
   b.onclick=async()=>{
    if(db){
     await db.from('mican_activity').insert({
      activity_type:'feedback',question:q,feedback:v
     });
    }
    add('Thanks for your feedback!');
   };
   row.append(b);
  });

  $('messages').append(row);
 }else{
  add("I couldn't find a reliable saved answer. Your question has been sent to the admin review inbox.");
 }
}

function photo(e){
 photoFile=e.target.files[0];
 if(!photoFile)return;
 $('preview').src=URL.createObjectURL(photoFile);
 $('photoBox').classList.remove('hidden');
 $('photoStatus').textContent='Photo selected. Tap Read question.';
}

async function readPhoto(){
 if(!photoFile)return;
 $('photoStatus').textContent='Reading text…';

 try{
  let r=await Tesseract.recognize(photoFile,'eng');
  let t=r.data.text.trim();

  if(!t){
   $('photoStatus').textContent='Could not find readable text. Try again or type it.';
   return;
  }

  $('question').value=t;
  $('photoStatus').textContent='Text extracted. Check it, then press Send.';
  add('Text found in your photo. Check the message box and press Send.');
 }catch(e){
  $('photoStatus').textContent='Photo reading failed. You can type the question.';
 }
}

function removePhoto(){
 photoFile=null;
 $('camera').value='';
 $('photoBox').classList.add('hidden');
}

function voice(){
 let S=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!S){
  alert('Voice input is unavailable in this browser.');
  return;
 }

 rec=new S();
 rec.lang='en-NG';
 rec.onresult=e=>$('question').value=e.results[0][0].transcript;
 rec.onend=()=>rec=null;
 rec.start();
}

function setTheme(v){
 document.body.classList.toggle('light',v==='light');
 localStorage.setItem('micanTheme',v);
}

async function login(){
 if(!db){
  $('loginStatus').textContent='Database connection is unavailable. Refresh the page and try again.';
  return;
 }

 let e=$('email').value.trim(),p=$('password').value;
 $('loginStatus').textContent='Signing in…';

 let r=await db.auth.signInWithPassword({email:e,password:p});

 if(r.error){
  $('loginStatus').textContent=r.error.message;
  return;
 }

 if((r.data.user.email||'').toLowerCase()!==ADMIN){
  await db.auth.signOut();
  $('loginStatus').textContent='Not authorised';
  return;
 }

 $('loginBox').classList.add('hidden');
 $('adminPanel').classList.remove('hidden');

 await loadSaved();
 await loadActivity();
 await loadAdminQuizzes();
}

async function loadSaved(){
 if(!db){alert('Database connection is unavailable.');return}

 let r=await db.from('mican_replies').select('*')
 .order('created_at',{ascending:false});

 if(r.error){alert(r.error.message);return}

 replies=r.data||[];
 renderSaved();
}

function renderSaved(){
 let term=norm($('savedSearch').value),list=$('savedList');
 list.replaceChildren();
 $('savedCount').textContent=replies.length;

 replies.filter(r=>!term||norm(r.question+' '+r.answer).includes(term))
 .forEach(r=>{
  let d=document.createElement('div');
  d.className='entry';

  let b=document.createElement('b');
  b.textContent=r.question;

  let a=document.createElement('p');
  a.textContent=r.answer;

  let e=document.createElement('button');
  e.textContent='Edit';
  e.className='alt';
  e.onclick=()=>{
   editId=r.id;
   $('savedQuestion').value=r.question;
   $('savedAnswer').value=r.answer;
   $('cancelEdit').classList.remove('hidden');
  };

  let del=document.createElement('button');
  del.textContent='Delete';
  del.onclick=async()=>{
   if(confirm('Delete this answer?')){
    let x=await db.from('mican_replies').delete().eq('id',r.id);
    if(x.error)alert(x.error.message);
    else loadSaved();
   }
  };

  d.append(b,a,e,del);
  list.append(d);
 });
}

async function saveReply(){
 if(!db){alert('Database connection is unavailable.');return}

 let question=$('savedQuestion').value.trim();
 let answer=$('savedAnswer').value.trim();

 if(!question||!answer){
  alert('Enter both fields');
  return;
 }

 let r=editId
 ?await db.from('mican_replies').update({
   question,answer,updated_at:new Date().toISOString()
  }).eq('id',editId)
 :await db.from('mican_replies').insert({
   question,answer,active:true
  });

 if(r.error){alert(r.error.message);return}

 cancelEdit();
 await loadSaved();
 alert('Saved!');
}

function cancelEdit(){
 editId=null;
 $('savedQuestion').value='';
 $('savedAnswer').value='';
 $('cancelEdit').classList.add('hidden');
}
