<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MICAN AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:white;font-family:Arial,sans-serif}
header{padding:20px;background:#17243a;text-align:center}
header h1{color:#50d6ff;margin:0}
main{max-width:700px;margin:25px auto;padding:15px}
.panel{background:#1b2b43;padding:18px;border-radius:14px;margin-bottom:15px}
input,textarea,button{width:100%;padding:13px;margin:7px 0;border:0;border-radius:8px;font-size:15px}
input,textarea{background:#f1f5f9;color:#111}
button{background:#08a9d6;color:white;font-weight:bold;cursor:pointer}
button.secondary{background:#40516a}
#messages{height:320px;overflow:auto;background:#0c1422;padding:12px;border-radius:10px}
.msg{padding:10px;margin:8px 0;border-radius:9px;background:#263b55;white-space:pre-wrap;overflow-wrap:anywhere}
.user{background:#075b75}
.small{color:#b9c7d8;font-size:13px}
.hidden{display:none}
.reply{border-top:1px solid #40516a;padding:10px 0}
</style>
</head>

<body>

<header>
<h1>MICAN AI</h1>
<p>Your all-in-one saved-answer assistant</p>
</header>

<main>

<section class="panel">
<h3>Chat with MICAN</h3>
<div id="messages"></div>
<input id="question" placeholder="Ask MICAN anything...">
<button onclick="askMican()">Send message</button>
<p class="small">MICAN answers using information saved by its admin.</p>
</section>

<!-- ADMIN SECTION: HIDDEN BY DEFAULT -->
<section id="adminSection" class="panel hidden">

<button class="secondary" onclick="showAdmin()">Admin Login</button>

<div id="adminLogin" class="hidden">
<h3>MICAN Admin</h3>
<input id="email" type="email" placeholder="Admin email">
<input id="password" type="password" placeholder="Admin password">
<button onclick="login()">Login</button>
<p id="loginStatus" class="small"></p>
</div>

<div id="adminPanel" class="hidden">
<h3>Manage MICAN Replies</h3>
<p class="small">Only the authorised admin can manage saved answers.</p>

<input id="savedQuestion" placeholder="Question visitors may ask">
<textarea id="savedAnswer" rows="4" placeholder="MICAN's saved answer"></textarea>

<button onclick="saveReply()">Save answer</button>
<button class="secondary" onclick="logout()">Logout</button>

<h3>Saved replies</h3>
<div id="replyList"></div>
</div>

</section>
</main>

<script>
/* MICAN AI SUPABASE CONNECTION */
const SUPABASE_URL = "https://ozktfslqrqxdqkvgdlpn.supabase.co";
const SUPABASE_KEY = "sb_publishable_qen-gTBWNSvaBp8AHZ936A_tnPvpYe9";
const ADMIN_EMAIL = "itzmican42@gmail.com";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let editingId = null;
let replies = [];

/* SHOW ADMIN SECTION ONLY WITH #admin */
function revealAdminAccess(){
  const section=document.getElementById("adminSection");

  if(section && window.location.hash==="#admin"){
    section.classList.remove("hidden");
  }else if(section){
    section.classList.add("hidden");
  }
}

window.addEventListener("hashchange",revealAdminAccess);
revealAdminAccess();

/* CHAT MESSAGES */
function addMessage(text,who){
  const box=document.getElementById("messages");
  const item=document.createElement("div");

  item.className="msg "+(who==="user"?"user":"");
  item.textContent=(who==="user"?"You: ":"MICAN: ")+text;

  box.appendChild(item);
  box.scrollTop=box.scrollHeight;
}

/* NORMALISE QUESTIONS */
function normalize(s){
  return s.toLowerCase()
    .replace(/[^a-z0-9 ]/g," ")
    .replace(/\s+/g," ").trim();
}

/* LOAD SAVED ANSWERS */
async function loadReplies(){
  const {data,error}=await db.from("mican_replies")
    .select("*").eq("active",true);

  if(error){
    console.error("Could not load replies:",error.message);
    return;
  }

  replies=data||[];
}

/* ASK MICAN */
async function askMican(){
  const field=document.getElementById("question");
  const q=field.value.trim();

  if(!q)return;

  field.value="";
  addMessage(q,"user");

  await loadReplies();

  const query=normalize(q);
  let best=null;
  let bestScore=0;

  for(const r of replies){
    const saved=normalize(r.question);
    let score=0;

    if(query===saved){
      score=100;
    }else if(query.includes(saved)||saved.includes(query)){
      score=75;
    }else{
      const words=saved.split(" ");
      const matches=words.filter(w=>w.length>2&&query.includes(w));
      score=(matches.length/Math.max(words.length,1))*100;
    }

    if(score>bestScore){
      bestScore=score;
      best=r;
    }
  }

  if(best&&bestScore>=45){
    addMessage(best.answer,"bot");
  }else{
    addMessage(
      "I don't have a saved answer for that yet. Please contact the MICAN admin so this answer can be added.",
      "bot"
    );
  }
}

document.getElementById("question").addEventListener("keydown",e=>{
  if(e.key==="Enter")askMican();
});

/* ADMIN LOGIN BUTTON */
function showAdmin(){
  document.getElementById("adminLogin").classList.toggle("hidden");
}

/* ADMIN AUTHENTICATION */
async function login(){
  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const status=document.getElementById("loginStatus");

  status.textContent="Checking login...";

  if(!email||!password){
    status.textContent="Enter your email and password.";
    return;
  }

  const {data,error}=await db.auth.signInWithPassword({
    email,password
  });

  if(error){
    status.textContent=error.message;
    return;
  }

  if(!data.user.email||
     data.user.email.toLowerCase()!==ADMIN_EMAIL.toLowerCase()){
    await db.auth.signOut();
    status.textContent="This account is not authorised as MICAN admin.";
    return;
  }

  document.getElementById("adminLogin").classList.add("hidden");
  document.getElementById("adminPanel").classList.remove("hidden");

  await loadAdminReplies();
}

/* LOAD ADMIN REPLIES */
async function loadAdminReplies(){
  const {data,error}=await db.from("mican_replies")
    .select("*").order("created_at",{ascending:false});

  if(error){
    alert("Could not load saved replies: "+error.message);
    return;
  }

  const list=document.getElementById("replyList");
  list.replaceChildren();

  (data||[]).forEach(r=>{
    const item=document.createElement("div");
    item.className="reply";

    const q=document.createElement("p");
    q.textContent="Question: "+r.question;

    const a=document.createElement("p");
    a.textContent="Answer: "+r.answer;

    const edit=document.createElement("button");
    edit.textContent="Edit";
    edit.onclick=()=>editReply(r);

    const del=document.createElement("button");
    del.textContent="Delete";
    del.className="secondary";
    del.onclick=()=>deleteReply(r.id);

    item.append(q,a,edit,del);
    list.appendChild(item);
  });
}

/* SAVE ANSWER */
async function saveReply(){
  const question=document.getElementById("savedQuestion").value.trim();
  const answer=document.getElementById("savedAnswer").value.trim();

  if(!question||!answer){
    alert("Enter both a question and an answer.");
    return;
  }

  let result;

  if(editingId){
    result=await db.from("mican_replies")
      .update({
        question,
        answer,
        updated_at:new Date().toISOString()
      })
      .eq("id",editingId);
  }else{
    result=await db.from("mican_replies").insert({
      question,
      answer,
      active:true
    });
  }

  if(result.error){
    alert("Could not save: "+result.error.message);
    return;
  }

  editingId=null;
  document.getElementById("savedQuestion").value="";
  document.getElementById("savedAnswer").value="";

  await loadAdminReplies();
  alert("MICAN answer saved!");
}

/* EDIT ANSWER */
function editReply(r){
  editingId=r.id;
  document.getElementById("savedQuestion").value=r.question;
  document.getElementById("savedAnswer").value=r.answer;
}

/* DELETE ANSWER */
async function deleteReply(id){
  if(!confirm("Delete this saved answer?"))return;

  const {error}=await db.from("mican_replies")
    .delete().eq("id",id);

  if(error){
    alert("Could not delete: "+error.message);
    return;
  }

  await loadAdminReplies();
}

/* LOGOUT */
async function logout(){
  await db.auth.signOut();

  document.getElementById("adminPanel").classList.add("hidden");
  document.getElementById("adminLogin").classList.remove("hidden");
  document.getElementById("password").value="";

  alert("Logged out.");
}

loadReplies();
</script>

</body>
</html>
