<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MICAN AI</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
:root{--bg:#071b3a;--panel:#102b52;--panel2:#173d70;--fg:#f4f8ff;--muted:#c1d4f2;--cyan:#55e2ff;--line:#2c5d91}
body.light{--bg:#eaf4ff;--panel:#ffffff;--panel2:#e3f1ff;--fg:#102744;--muted:#526b88;--line:#bfd8f2}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 15% 5%,#174b83 0,#0b2850 36%,#07152d 100%);background-attachment:fixed;color:var(--fg);font:15px Arial}
button,input,textarea,select{font:inherit;border-radius:10px;padding:11px;border:1px solid var(--line)}
button{background:var(--cyan);color:#062033;font-weight:bold;cursor:pointer}
button.alt{background:var(--panel2);color:var(--fg)}
input,textarea,select{background:var(--panel2);color:var(--fg);width:100%;margin:5px 0}
header{display:flex;gap:14px;align-items:center;padding:14px;background:linear-gradient(100deg,#123d70,#14558b);border-bottom:1px solid #3477ad;box-shadow:0 4px 18px #0004}
header b{font-size:23px;color:#72edff;letter-spacing:.4px}
header .menuBtn{width:54px;height:54px;min-width:54px;padding:0;border-radius:15px;font-size:29px;line-height:1;background:#1c5d91;color:#fff;border:1px solid #4b9bd0;box-shadow:0 4px 12px #0003}
.wrap{max-width:900px;margin:auto;padding:12px}
.card{background:linear-gradient(145deg,#12345d,#102747);border:1px solid #2c5b89;border-radius:18px;padding:15px;margin:12px 0;box-shadow:0 12px 30px #0003}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:12px}
#messages{height:52vh;min-height:300px;overflow:auto;background:linear-gradient(160deg,#07182e,#0b2444);border:1px solid #315b86;padding:12px;border-radius:14px}
.msg{background:#1d4775;padding:12px 14px;border-radius:14px;margin:8px 0;white-space:pre-wrap;max-width:94%;overflow-wrap:anywhere;box-shadow:0 3px 10px #0002}
.user{background:#087e9e;margin-left:auto}
.row{display:flex;gap:6px;align-items:center}
.row>*{min-width:0}
.row input{flex:1}
.row button{flex-shrink:0}
.drawer{position:fixed;z-index:5;inset:0 auto 0 0;width:min(300px,85vw);background:var(--panel);padding:14px;box-shadow:0 0 0 100vmax #0009;overflow:auto}
.drawer button{width:100%;text-align:left;margin:4px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.grid button{background:var(--panel2);color:var(--fg);text-align:left}
details{background:var(--panel2);padding:10px;border-radius:10px;margin:8px 0}
.entry{border-bottom:1px solid var(--line);padding:10px}
img.preview{max-width:100%;max-height:220px;border-radius:10px}
</style>
</head>
